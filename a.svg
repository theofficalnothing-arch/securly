<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%"
     viewBox="0 0 900 500">

  <defs>
    <style>
      .title {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 38px;
        font-weight: bold;
      }
      .subtitle {
        fill: #999;
        font-family: Arial, sans-serif;
        font-size: 16px;
      }
      .card {
        fill: #1b1b1b;
        stroke: #383838;
        stroke-width: 1.5;
      }
      .label {
        fill: white;
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
  </defs>

  <rect width="900" height="500" fill="#101010"/>

  <text x="450" y="90" text-anchor="middle" class="title">
    Choose a Page
  </text>

  <text x="450" y="125" text-anchor="middle" class="subtitle">
    Select an option to continue.
  </text>

  <!-- DuckMath -->
  <a xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/duckmath.svg">
    <rect class="card" x="45" y="175" width="250" height="235" rx="16"/>
    <image
      x="125" y="215" width="90" height="90"
      xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/duckmath.svg"
      preserveAspectRatio="xMidYMid meet"/>
    <text x="170" y="350" text-anchor="middle" class="label">
      DuckMath
    </text>
  </a>

  <!-- Securly -->
  <a xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/securly.svg">
    <rect class="card" x="325" y="175" width="250" height="235" rx="16"/>
    <image
      x="405" y="215" width="90" height="90"
      xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/securly.svg"
      preserveAspectRatio="xMidYMid meet"/>
    <text x="450" y="350" text-anchor="middle" class="label">
      Securly
    </text>
  </a>

  <!-- Opium -->
  <a xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg">
    <rect class="card" x="605" y="175" width="250" height="235" rx="16"/>
    <image
      x="685" y="215" width="90" height="90"
      xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg"
      preserveAspectRatio="xMidYMid meet"/>
    <text x="730" y="350" text-anchor="middle" class="label">
      Opium
    </text>
  </a>

</svg>
