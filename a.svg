<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%" viewBox="0 0 600 400"
     preserveAspectRatio="none">

  <title>Choose a page</title>

  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="width:100%;height:100%;margin:0;">

      <style>
        * { box-sizing: border-box; }

        .page {
          width: 100%;
          height: 100%;
          min-height: 100%;
          padding: clamp(12px, 4vw, 35px);
          background: #10131a;
          color: #f5f5f5;
          font-family: Arial, sans-serif;
          text-align: center;
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        h2 {
          font-size: clamp(22px, 4vw, 32px);
          margin: 0 0 12px;
        }

        p {
          color: #a5adbd;
          margin: 0;
          font-size: clamp(12px, 2vw, 16px);
        }

        .options {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: clamp(6px, 2vw, 18px);
          margin-top: clamp(20px, 6vh, 38px);
        }

        .options a {
          min-width: 0;
          min-height: clamp(120px, 30vh, 190px);
          padding: 14px 5px;
          background: #1c2230;
          border: 1px solid #343d50;
          border-radius: 14px;
          color: white;
          text-decoration: none;
          font-size: clamp(12px, 2.5vw, 18px);
          font-weight: bold;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          overflow-wrap: anywhere;
        }

        .options a:hover,
        .options a:focus-visible {
          background: #29344a;
          border-color: #879bff;
          outline: none;
        }

        .emoji {
          font-size: clamp(32px, 7vw, 54px);
          line-height: 1.2;
        }

        .hint {
          margin-top: 24px;
          color: #7f899d;
          font-size: 12px;
        }
      </style>

      <div class="page">
        <h2>Choose a page</h2>
        <p>Which page would you like to open?</p>

        <div class="options">

          <a href="https://esm.sh/gh/theofficalnothing-arch/securly@main/duckmath.svg"
             target="_top">
            <span class="emoji">🦆</span>
            <span>DuckMath</span>
          </a>

          <a href="https://esm.sh/gh/theofficalnothing-arch/securly@main/securly.svg"
             target="_top">
            <span class="emoji">🔒</span>
            <span>Securly</span>
          </a>

          <a href="https://esm.sh/gh/theofficalnothing-arch/securly@main/svg/icon.svg"
             target="_top">
            <span class="emoji">🔥</span>
            <span>Opium</span>
          </a>

        </div>

        <div class="hint">Click a choice to continue</div>
      </div>
    </div>
  </foreignObject>
</svg>
