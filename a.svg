<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%"
     viewBox="0 0 1000 700"
     preserveAspectRatio="none">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0;overflow:auto;">
      <div style="min-height:100vh;width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#10131a;color:#f5f5f5;font-family:Arial,sans-serif;padding:24px;">
        <main style="width:min(700px,100%);margin:auto;text-align:center;">
          <h1 style="font-size:28px;margin:0 0 10px;">Choose a Page</h1>
          <p style="color:#a5adbd;margin:0;">Which page would you like to open?</p>

          <div style="display:flex;justify-content:center;gap:16px;margin-top:32px;flex-wrap:wrap;">
            <a href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/duckmath.svg"
               style="flex:1 1 120px;max-width:200px;min-width:120px;box-sizing:border-box;padding:28px 12px;border:1px solid #343d50;border-radius:14px;background:#1c2230;color:white;text-decoration:none;font-size:18px;font-weight:bold;">
              <span style="display:block;font-size:38px;margin-bottom:16px;">🦆</span>
              DuckMath
            </a>

            <a href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/securly.svg"
               style="flex:1 1 120px;max-width:200px;min-width:120px;box-sizing:border-box;padding:28px 12px;border:1px solid #343d50;border-radius:14px;background:#1c2230;color:white;text-decoration:none;font-size:18px;font-weight:bold;">
              <span style="display:block;font-size:38px;margin-bottom:16px;">🔒</span>
              Securly
            </a>

            <a href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg"
               style="flex:1 1 120px;max-width:200px;min-width:120px;box-sizing:border-box;padding:28px 12px;border:1px solid #343d50;border-radius:14px;background:#1c2230;color:white;text-decoration:none;font-size:18px;font-weight:bold;">
              <span style="display:block;font-size:38px;margin-bottom:16px;">🔥</span>
              Opium
            </a>
          </div>

          <p style="margin-top:26px;color:#7f899d;font-size:12px;">Click a choice to continue</p>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
