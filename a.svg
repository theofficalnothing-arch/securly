
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" width="100%" height="100%">
  <title>Choose a Website</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#202b40"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26354b"/>
      <stop offset="100%" stop-color="#182437"/>
    </linearGradient>
    <style>
      .heading { font: 700 44px Arial, sans-serif; fill: #ffffff; }
      .subheading { font: 18px Arial, sans-serif; fill: #aebbd0; }
      .name { font: 700 25px Arial, sans-serif; fill: #ffffff; }
      .description { font: 16px Arial, sans-serif; fill: #b9c6d8; }
      .card { fill: url(#card); stroke: #394b64; stroke-width: 2; }
      .website { cursor: pointer; }
      .website:hover .card { stroke: #7c9dff; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#background)"/>

  <circle cx="100" cy="90" r="150" fill="#526ef5" opacity=".08"/>
  <circle cx="1110" cy="620" r="220" fill="#21c9b4" opacity=".07"/>

  <text x="600" y="105" text-anchor="middle" class="heading">Choose a Website</text>
  <text x="600" y="145" text-anchor="middle" class="subheading">Select an option to open the website</text>

  <!-- Duck Math -->
  <a class="website" href="https://duckmath.org/" target="_blank" rel="noopener">
    <rect class="card" x="70" y="205" width="330" height="380" rx="24"/>

    <rect x="165" y="250" width="140" height="140" rx="25" fill="#ffffff"/>

    <image x="180" y="265" width="110" height="110"
      href="https://duckmath.org/favicon.ico"
      xlink:href="https://duckmath.org/favicon.ico"
      preserveAspectRatio="xMidYMid meet"/>

    <text x="235" y="445" text-anchor="middle" class="name">Duck Math</text>
    <text x="235" y="478" text-anchor="middle" class="description">Math games and activities</text>

    <rect x="140" y="515" width="190" height="43" rx="12" fill="#5a79ff"/>
    <text x="235" y="543" text-anchor="middle" font="700 16px Arial" fill="#ffffff">Open Website</text>
  </a>

  <!-- Securly -->
  <a class="website" href="https://securly.com/" target="_blank" rel="noopener">
    <rect class="card" x="435" y="205" width="330" height="380" rx="24"/>

    <rect x="530" y="250" width="140" height="140" rx="25" fill="#ffffff"/>

    <image x="545" y="265" width="110" height="110"
      href="https://securly.com/favicon.ico"
      xlink:href="https://securly.com/favicon.ico"
      preserveAspectRatio="xMidYMid meet"/>

    <text x="600" y="445" text-anchor="middle" class="name">Securly</text>
    <text x="600" y="478" text-anchor="middle" class="description">Securly website</text>

    <rect x="505" y="515" width="190" height="43" rx="12" fill="#5a79ff"/>
    <text x="600" y="543" text-anchor="middle" font="700 16px Arial" fill="#ffffff">Open Website</text>
  </a>

  <!-- Opium -->
  <a class="website" href="https://duckmath.org/" target="_blank" rel="noopener">
    <rect class="card" x="800" y="205" width="330" height="380" rx="24"/>

    <rect x="895" y="250" width="140" height="140" rx="25" fill="#ffffff"/>

    <image x="910" y="265" width="110" height="110"
      href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg"
      xlink:href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg"
      preserveAspectRatio="xMidYMid meet"/>

    <text x="965" y="445" text-anchor="middle" class="name">Opium</text>
    <text x="965" y="478" text-anchor="middle" class="description">Open Opium</text>

    <rect x="870" y="515" width="190" height="43" rx="12" fill="#5a79ff"/>
    <text x="965" y="543" text-anchor="middle" font="700 16px Arial" fill="#ffffff">Open Website</text>
  </a>

  <text x="600" y="645" text-anchor="middle" class="subheading">Choose your option above</text>
</svg>
