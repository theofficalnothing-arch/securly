
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick</title>
</head>
<body>
  <img
    src="https://raw.githubusercontent.com/theofficalnothing-arch/securly/main/pick.svg"
    alt="Pick"
    width="400"
  >

  <button id="pickButton">Pick a random option</button>
  <p id="result"></p>

  <script type="module">
    import { pick } from "https://esm.sh/gh/theofficalnothing-arch/securly@main/pick.js";

    document.getElementById("pickButton").addEventListener("click", () => {
      document.getElementById("result").textContent =
        pick(["Option 1", "Option 2", "Option 3"]);
    });
  </script>
</body>
</html>
