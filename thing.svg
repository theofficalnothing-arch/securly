<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="100%"
     viewBox="0 0 1000 800"
     preserveAspectRatio="none"
     style="background:#0b0b0b">

  <rect width="1000" height="800" fill="#0b0b0b"/>

  <text x="60" y="75" fill="white" font-size="36"
        font-family="Arial" font-weight="bold">SVG Link Hub</text>
  <text x="60" y="110" fill="#999" font-size="18"
        font-family="Arial">Choose an asset to open its SVG.</text>

  <a id="duckmath" target="_blank" rel="noopener"
     href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/duckmath.svg">
    <rect x="60" y="150" width="880" height="75" rx="12" fill="#191919" stroke="#303030"/>
    <text x="90" y="196" fill="white" font-size="24" font-family="Arial">DuckMath</text>
    <text x="900" y="196" fill="#777" font-size="24" text-anchor="end" font-family="Arial">↗</text>
  </a>

  <a id="securly" target="_blank" rel="noopener"
     href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/securly.svg">
    <rect x="60" y="245" width="880" height="75" rx="12" fill="#191919" stroke="#303030"/>
    <text x="90" y="291" fill="white" font-size="24" font-family="Arial">Securly</text>
    <text x="900" y="291" fill="#777" font-size="24" text-anchor="end" font-family="Arial">↗</text>
  </a>

  <a id="opium" target="_blank" rel="noopener"
     href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/svg/icon.svg">
    <rect x="60" y="340" width="880" height="75" rx="12" fill="#191919" stroke="#303030"/>
    <text x="90" y="386" fill="white" font-size="24" font-family="Arial">Opium</text>
    <text x="900" y="386" fill="#777" font-size="24" text-anchor="end" font-family="Arial">↗</text>
  </a>

  <a id="catclass" target="_blank" rel="noopener"
     href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/catclass.svg">
    <rect x="60" y="435" width="880" height="75" rx="12" fill="#191919" stroke="#303030"/>
    <text x="90" y="481" fill="white" font-size="24" font-family="Arial">CatClass</text>
    <text x="900" y="481" fill="#777" font-size="24" text-anchor="end" font-family="Arial">↗</text>
  </a>

  <a id="arsenic" target="_blank" rel="noopener"
     href="https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/arsenic.svg">
    <rect x="60" y="530" width="880" height="75" rx="12" fill="#191919" stroke="#303030"/>
    <text x="90" y="576" fill="white" font-size="24" font-family="Arial">Arsenic</text>
    <text x="900" y="576" fill="#777" font-size="24" text-anchor="end" font-family="Arial">↗</text>
  </a>

  <text x="60" y="740" fill="#666" font-size="16" font-family="Arial">SVG LINK HUB</text>

  <script>
    <![CDATA[
    (function () {
      const current = window.location.href;
      let base;

      if (current.includes("unpkg.com")) {
        base = "https://unpkg.com/securly-assets@1.0.2/";
      } else if (current.includes("esm.sh")) {
        base = "https://esm.sh/gh/theofficalnothing-arch/securly@main/";
      } else if (current.includes("cdn.jsdelivr.net")) {
        base = "https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/";
      } else if (current.includes("raw.githubusercontent.com")) {
        base = "https://raw.githubusercontent.com/theofficalnothing-arch/securly/main/";
      } else {
        base = "https://cdn.jsdelivr.net/gh/theofficalnothing-arch/securly@main/";
      }

      document.getElementById("duckmath").setAttribute("href", base + "duckmath.svg");
      document.getElementById("securly").setAttribute("href", base + "securly.svg");
      document.getElementById("opium").setAttribute("href", base + "svg/icon.svg");
      document.getElementById("catclass").setAttribute("href", base + "catclass.svg");
      document.getElementById("arsenic").setAttribute("href", base + "arsenic.svg");
    })();
    ]]>
  </script>
</svg>
